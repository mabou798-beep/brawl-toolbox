name: brawl_fan_app
description: "Brawl Toolbox - an unofficial companion for Brawl Stars: player stats, the live event rotation, every brawler and every map."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.0
  font_awesome_flutter: ^11.0.0
  http: ^1.5.0
  provider: ^6.1.5
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  google_mobile_ads: ^9.0.0
  app_tracking_transparency: ^2.0.7
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
